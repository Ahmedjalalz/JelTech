  <circle cx="50" cy="28" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="70" cy="28" r="6" fill="#45BE43" opacity="0.8" />
  
  <rect x="360" y="14" width="480" height="28" rx="6" fill="#24292d" />
