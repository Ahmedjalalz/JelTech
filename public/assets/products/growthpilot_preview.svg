    <text x="70" y="181" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Apex Retail Packaging</text>
    <text x="70" y="198" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Custom mailer boxes consultation</text>
    <rect x="330" y="176" width="76" height="20" rx="10" fill="#38bdf8" fill-opacity="0.2" />
    <text x="368" y="190" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">FOLLOW-UP</text>

    <!-- Lead row 3 -->
