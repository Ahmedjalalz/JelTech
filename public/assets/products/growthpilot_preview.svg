  <rect x="14" y="186" width="192" height="36" rx="6" fill="transparent" />
  <text x="30" y="209" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8">🔍 SEO Intelligence</text>

  <rect x="14" y="232" width="192" height="36" rx="6" fill="transparent" />
  <text x="30" y="255" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8">📊 Meta Ads Evaluator</text>

