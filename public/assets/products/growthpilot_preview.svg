    <circle cx="44" cy="264" r="14" fill="#a855f7" fill-opacity="0.2" />
    <text x="44" y="269" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#a855f7" text-anchor="middle">BC</text>
    <text x="70" y="259" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Beacon Consulting</text>
    <text x="70" y="276" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Website redesign inquiry</text>
    <rect x="330" y="254" width="76" height="20" rx="10" fill="#a855f7" fill-opacity="0.2" />
    <text x="368" y="268" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#a855f7" text-anchor="middle">QUALIFIED</text>

