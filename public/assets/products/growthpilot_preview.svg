    <text x="330" y="65" font-family="Inter, sans-serif" font-size="28" font-weight="bold" fill="#f8fafc">18<tspan font-size="14" font-weight="normal" fill="#94a3b8"> Recommended</tspan></text>
    <text x="330" y="105" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Targeting local service commercial intent</text>

