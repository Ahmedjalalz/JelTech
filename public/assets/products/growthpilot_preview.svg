    <text x="36" y="350" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Route incoming web inquiries into streamlined multi-channel response triggers.</text>
    <text x="36" y="372" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Planned integration: WhatsApp Business API &amp; Resend</text>
